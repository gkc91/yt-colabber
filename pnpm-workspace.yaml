packages:
  - apps/*

# Packages whose install scripts may run. @sentry/cli fetches its binary (source-map upload).
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  # landing: renders the Open Graph image from SVG (apps/landing/scripts/og-image.mjs).
  sharp: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo@57.0.26
  - '@expo/ui@57.0.21'
  - expo-router@57.0.24
  - expo-updates@57.0.24
